name: Workflow Docker

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mediocreatmybest/ipxe-buildweb

jobs:
  validate:
    name: Validate scripts and Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          for f in install.sh start.sh update.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          ignore_paths: ipxe

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          # Only fail on genuine errors. hadolint's warning/info findings
          # here are apt-version pinning and RUN-layer consolidation
          # suggestions across the whole file -- worth doing, but a
          # separate cleanup packet, not something this CI check should
          # block every build over.
          failure-threshold: error

  build:
    name: Build test image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Build the exact commit under test rather than letting install.sh
      # silently clone whatever is currently on master. On a pull_request
      # event github.sha is a synthetic merge commit, so use the PR's own
      # head commit instead.
      - name: Resolve revision under test
        id: rev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            GIT_REF=${{ steps.rev.outputs.ref }}
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run --detach \
            --publish 8080:80 \
            --name rom-o-matic-smoke \
            ${{ env.IMAGE_NAME }}:test

      # Bounded readiness loop: fail fast if the container exits, otherwise
      # poll HTTP until it responds or the timeout is reached.
      - name: Wait for HTTP readiness
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' rom-o-matic-smoke)" != "true" ]; then
              echo "Container exited before becoming ready"
              exit 1
            fi
            if curl -sf http://localhost:8080/ -o /dev/null; then
              echo "HTTP ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for HTTP readiness"
          exit 1

      - name: Verify expected page content
        run: |
          curl -sf http://localhost:8080/ | grep -q 'ROM-o-matic' || {
            echo "Root page did not contain the expected ROM-o-matic identifier"
            exit 1
          }

      # Prove the published image can actually do its one job, not just
      # serve a web page. This is the same request the wizard's JS
      # constructs (see public/js/ui.js's buildcfg()) -- build.fcgi clones
      # and compiles from the iPXE submodule already baked into the image
      # (build.ini's repository=/opt/rom-o-matic/ipxe/.git, cloned
      # --local/--bare/--shared), so this never touches the network.
      - name: Submit a representative iPXE build
        run: |
          curl -sf --max-time 120 \
            -D /tmp/build-headers.txt \
            -o /tmp/undionly.kpxe \
            'http://localhost:8080/build.fcgi?BINARY=undionly.kpxe&BINDIR=bin&REVISION=master&DEBUG=&EMBED.00script.ipxe=' || {
            echo "Build request failed"
            exit 1
          }
          grep -qi '^Content-Disposition: attachment' /tmp/build-headers.txt || {
            echo "Response did not look like a file download"
            cat /tmp/build-headers.txt
            exit 1
          }
          size=$(stat -c%s /tmp/undionly.kpxe)
          echo "Build artefact size: ${size} bytes"
          if [ "$size" -lt 10000 ]; then
            echo "Build artefact is suspiciously small (${size} bytes) -- likely an error page, not a real binary"
            exit 1
          fi

      - name: Print container logs on failure
        if: failure()
        run: docker logs rom-o-matic-smoke

      - name: Clean up test container
        if: always()
        run: docker rm --force rom-o-matic-smoke

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: build
    # Only master pushes can reach login/push. Pull requests and manual
    # dispatch runs stop at the build job above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
